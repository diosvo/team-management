name: 🔍 Preview Deployment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    uses: ./.github/workflows/test-and-deploy.yaml
    with:
      environment: preview
      vercel-environment: preview
      build-args: ""
      deploy-args: "--prebuilt --yes"
    secrets: inherit

  report-pr:
    needs: preview
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download test report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.preview.outputs.summary_artifact }}
          path: .

      - name: 💬 Upsert PR comment
        uses: actions/github-script@v9
        env:
          DEPLOY_RESULT: ${{ needs.preview.result }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
          MARKER: '<!-- preview-deploy-report -->'
          SUMMARY_FILE: ${{ needs.preview.outputs.summary_file }}
        with:
          script: |
            const fs = require('node:fs');
            const { DEPLOY_RESULT, PREVIEW_URL, SUMMARY_FILE, MARKER } = process.env;

            let report = '⚠️ No unit-test summary found.';
            try {
              const raw = fs.readFileSync(SUMMARY_FILE, 'utf8');
              const lines = raw
                .split('\n')
                .filter((line) =>
                  line.startsWith('- **Test Files**:') ||
                  line.startsWith('- **Test Results**:')
                );

              if (lines.length) {
                report = lines.join('\n');
              }
            } catch (err) {
              core.warning(`Could not read ${SUMMARY_FILE}: ${err.message}`);
            }

            const body = [
              MARKER,
              '## 🚢 Preview URL',
              '',
              DEPLOY_RESULT === 'success' && PREVIEW_URL
                ? PREVIEW_URL
                : `Not deployed — \`preview\` result: ${DEPLOY_RESULT}.`,
              '',
              '## 🧪 Test Report',
              '',
              report,
            ].join('\n');

            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER),
            );

            let comment_id;
            if (existing) {
              comment_id = existing.id;
              await github.rest.issues.updateComment({
                ...issue,
                comment_id,
                body
              });
            } else {
              const created = await github.rest.issues.createComment({
                ...issue, 
                body
              });
              comment_id = created.data.id;
            }

            try {
              await github.request(
                'PUT /repos/{owner}/{repo}/issues/comments/{comment_id}/pin',
                { ...context.repo, comment_id },
              );
            } catch (err) {
              core.warning(`Could not pin comment ${comment_id}: ${err.message}`);
            }

