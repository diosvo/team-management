name: 🔍 Preview Deployment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    uses: ./.github/workflows/test-and-deploy.yaml
    with:
      environment: preview
      vercel-environment: preview
      build-args: ""
      deploy-args: "--prebuilt --yes"
    secrets: inherit

  report-pr:
    needs: preview
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.preview.outputs.summary_artifact }}
          path: .

      - name: 💬 Upsert PR comment
        uses: actions/github-script@v9
        env:
          DEPLOY_RESULT: ${{ needs.preview.result }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
          MARKER: '<!-- preview-deploy-report -->'
          TEST_FILE: ${{ needs.preview.outputs.test_summary_file }}
          AUDIT_FILE: ${{ needs.preview.outputs.audit_summary_file }}
        with:
          script: |
            const fs = require('node:fs');
            const { DEPLOY_RESULT, PREVIEW_URL, TEST_FILE, AUDIT_FILE, MARKER } = process.env;

            // A missing or empty fragment is reported in place rather than
            // dropping the section, so a broken upload is visible on the PR.
            const section = (file, extract) => {
              try {
                return extract(fs.readFileSync(file, 'utf8')).trim() || null;
              } catch (err) {
                core.warning(`Could not read ${file}: ${err.message}`);
                return null;
              }
            };

            const testReport = section(TEST_FILE, (raw) =>
              raw
                .split('\n')
                .filter((line) =>
                  line.startsWith('- **Test Files**:') ||
                  line.startsWith('- **Test Results**:') ||
                  line.startsWith('- **Coverage**:')
                )
                .join('\n'),
            ) ?? '⚠️ No unit-test summary found.';

            const auditReport =
              section(AUDIT_FILE, (raw) => raw) ??
              '⚠️ No dependency-audit summary found.';

            const body = [
              MARKER,
              '## 🚢 Preview URL',
              '',
              DEPLOY_RESULT === 'success' && PREVIEW_URL
                ? PREVIEW_URL
                : `Not deployed — \`preview\` result: ${DEPLOY_RESULT}.`,
              '',
              '## 🧪 Test Report',
              '',
              testReport,
              '',
              '## 🔍 Dependency Audit',
              '',
              auditReport,
            ].join('\n');

            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...issue,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                ...issue,
                body
              });
            }

