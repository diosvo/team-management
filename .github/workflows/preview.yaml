name: 🔍 Preview Deployment

on:
  pull_request:
    branches: [main] # Trigger on PRs targeting main branch

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  SUMMARY_ARTIFACT: unit-test-summary
  SUMMARY_FILE: unit-test-summary.md

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🚚 Setup pnpm & install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true

      - name: 🧪 Unit Tests
        env:
          GITHUB_STEP_SUMMARY: ${{ env.SUMMARY_FILE }}
        run: pnpm test

      - name: 📝 Publish test report to the job page
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SUMMARY_ARTIFACT }}
          path: ${{ env.SUMMARY_FILE }}
          if-no-files-found: warn
          retention-days: 3

  build-and-deploy:
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 📦 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🔽 Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: 🔨 Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: 🚀 Deploy to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          : "${url:?No preview URL was produced by the deploy step}"

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url" >> "$GITHUB_STEP_SUMMARY"

  report-pr:
    needs: [unit-test, build-and-deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download test report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SUMMARY_ARTIFACT }}
          path: .

      - name: 💬 Upsert PR comment with Preview URL + Test Report
        uses: actions/github-script@v9
        env:
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
          PREVIEW_URL: ${{ needs.build-and-deploy.outputs.preview_url }}
          TEST_RESULT: ${{ needs.unit-test.result }}
          MARKER: '<!-- preview-deploy-report -->'
        with:
          script: |
            const fs = require('node:fs');
            const { DEPLOY_RESULT, PREVIEW_URL, SUMMARY_FILE, MARKER } = process.env;

            let report = '⚠️ No unit-test summary found.';
            try {
              const raw = fs.readFileSync(SUMMARY_FILE, 'utf8');
              const lines = raw
                .split('\n')
                .filter((line) =>
                  line.startsWith('- **Test Files**:') ||
                  line.startsWith('- **Test Results**:')
                );

              if (lines.length) {
                report = lines.join('\n');
              }
            } catch (err) {
              core.warning(`Could not read ${SUMMARY_FILE}: ${err.message}`);
            }

            const body = [
              MARKER,
              '## 🚢 Preview URL',
              '',
              DEPLOY_RESULT === 'success' && PREVIEW_URL
                ? PREVIEW_URL
                : `Not deployed — \`build-and-deploy\` result: ${DEPLOY_RESULT}.`,
              '',
              '## 🧪 Test Report',
              '',
              report,
            ].join('\n');

            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...issue,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

