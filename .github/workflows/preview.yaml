name: 🔍 Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [main] # Trigger on PRs targeting main branch

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🚚 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧪 Unit Tests
        run: pnpm test

  build-and-deploy:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🚚 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
          cache: true

      - name: 📦 Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: 🔽 Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: 🔨 Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: 🚀 Deploy to Vercel
        id: deploy
        run: |
          URL="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" 2>&1 | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: 💬 Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            if (!url) {
              core.setFailed('No preview URL was produced by the deploy step.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🚢 Preview URL\n\n${url}`
            });
