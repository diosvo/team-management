name: 🧪 End-To-End Testing

on:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled, opened, synchronize]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Require e2e label
        run: |
          if [[ "${{ contains(toJson(github.event.pull_request.labels.*.name), 'e2e') }}" != "true" ]]; then
            echo "❌ Apply the 'e2e' label to run e2e tests before merging."
            exit 1
          fi
          echo "✅ e2e label detected."

  # ✨ Temporarily disabled to speed up development; will be enabled once a real database or alternative setup is established to prevent conflicts in production.
  e2e-tests:
    name: E2E Tests
    needs: e2e-gate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🚚 Setup
        uses: ./.github/actions/setup

      - name: 🎭 Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: 🧪 Run Playwright tests
        run: pnpm exec playwright test

      - name: 📊 Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-artifact
        with:
          name: playwright-report
          path: playwright/report/
