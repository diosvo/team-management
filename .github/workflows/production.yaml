name: 🚀 Production Deployment

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/test-and-deploy.yaml
    with:
      environment: production
      vercel-environment: production
      # Already gated on the PR that produced this commit.
      run-unit-test: false
      build-args: "--prod"
      deploy-args: "--prebuilt --prod --yes"
    secrets: inherit
