name: 🧪 Test

on:
  workflow_call:
    inputs:
      summary-artifact:
        description: Artifact name the unit-test and audit summaries share.
        required: false
        type: string
        default: unit-test-summary
      test-summary-file:
        description: Local file path for the unit-test markdown summary.
        required: false
        type: string
        default: unit-test-summary.md
      audit-summary-file:
        description: Local file path for the dependency-audit markdown fragment.
        required: false
        type: string
        default: audit-summary.md
    outputs:
      summary_artifact:
        description: Artifact name the summaries were uploaded under.
        value: ${{ inputs.summary-artifact }}
      test_summary_file:
        description: File name of the unit-test summary inside that artifact.
        value: ${{ inputs.test-summary-file }}
      audit_summary_file:
        description: File name of the audit summary inside that artifact.
        value: ${{ inputs.audit-summary-file }}

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: 🚚 Setup
        uses: ./.github/actions/setup

      - name: 🔎 Lint
        run: pnpm lint

      - name: 🧪 Unit Tests
        run: |
          pnpm test:coverage || status=$?

          cp "$GITHUB_STEP_SUMMARY" "${{ inputs.test-summary-file }}" ||
            echo "::warning::No step summary to capture for ${{ inputs.test-summary-file }}"
          exit $status

      # `next build` only type-checks files its routes reach, so type errors in
      # specs never fail a build.
      # Vitest transpiles without checking types at all.
      # This step is the only thing covering them.
      - name: 🔎 Type Check
        run: pnpm typecheck

      # Report-only: Runs even when the steps above failed,
      # so the comment always carries an audit section — and never fails the
      # job, so an audit that cannot run does not fail the PR.
      - name: 🔍 Dependency Audit
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          AUDIT_SUMMARY: ${{ inputs.audit-summary-file }}
        run: |
          pnpm audit:report

          {
            echo "### 🔍 Dependency Audit"
            cat "$AUDIT_SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY" ||
            echo "::warning::No audit summary to capture"

      - name: 📤 Upload reports
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ inputs.summary-artifact }}
          path: |
            ${{ inputs.test-summary-file }}
            ${{ inputs.audit-summary-file }}
